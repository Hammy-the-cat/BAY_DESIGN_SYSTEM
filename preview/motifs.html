<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Wave Motifs</title>
<style>
html,body{margin:0;padding:0;background:#FBF8F1;color:#0B2A3E;font-family:'Noto Sans JP',sans-serif}
.wrap{padding:22px 28px;display:flex;flex-direction:column;gap:14px}
.label{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:10px;letter-spacing:2.5px;color:#2A8FB7;text-transform:uppercase}
.tile{border-radius:18px;padding:18px;display:flex;align-items:center;justify-content:center;min-height:60px}
.t-tide{background:linear-gradient(180deg,#DDF1F4 0%,#FBF8F1 100%);color:#1F6E94;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:18px}
.t-deep{background:#0B2A3E;color:#87CEDA;position:relative;overflow:hidden}
.t-deep svg{width:100%;color:#87CEDA;opacity:0.5}
.t-sunrise{background:linear-gradient(180deg,#FBF8F1 0%,#FFC0AC 100%);color:#0B2A3E;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:18px}
</style></head>
<body>
<div class="wrap">
  <div class="label">Background washes</div>
  <div class="tile t-tide">tide wash · ocean-100 → sand-50</div>
  <div class="tile t-deep"><svg viewBox="0 0 480 32" fill="none"><path d="M2 16 C 30 4, 60 28, 90 16 S 150 4, 180 16 S 240 28, 270 16 S 330 4, 360 16 S 420 28, 478 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></div>
  <div class="tile t-sunrise">sunrise wash · sand-50 → coral-300</div>
</div>
</body></html>
