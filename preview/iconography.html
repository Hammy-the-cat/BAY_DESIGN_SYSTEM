<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Iconography</title>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500&family=Bricolage+Grotesque:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#FBF8F1;color:#0B2A3E;font-family:'Noto Sans JP',sans-serif}
.wrap{padding:22px 28px;display:flex;flex-direction:column;gap:14px}
.label{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:10px;letter-spacing:2.5px;color:#2A8FB7;text-transform:uppercase}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;width:60px}
.ic svg{stroke:#0B2A3E;stroke-width:1.5}
.ic span{font-size:10px;color:#6B6253;font-family:ui-monospace,monospace}
.note{font-size:11px;color:#6B6253;line-height:1.5}
.emoji{font-size:22px}
</style></head>
<body>
<div class="wrap">
  <div class="label">Lucide · primary icon set (substituted)</div>
  <div class="row">
    <div class="ic"><i data-lucide="map-pin"></i><span>map-pin</span></div>
    <div class="ic"><i data-lucide="calendar"></i><span>calendar</span></div>
    <div class="ic"><i data-lucide="dumbbell"></i><span>dumbbell</span></div>
    <div class="ic"><i data-lucide="waves"></i><span>waves</span></div>
    <div class="ic"><i data-lucide="leaf"></i><span>leaf</span></div>
    <div class="ic"><i data-lucide="instagram"></i><span>instagram</span></div>
    <div class="ic"><i data-lucide="mail"></i><span>mail</span></div>
    <div class="ic"><i data-lucide="arrow-right"></i><span>arrow-right</span></div>
  </div>
  <div class="label">Operational emoji (from brief)</div>
  <div class="row" style="gap:24px">
    <span class="emoji">📍</span><span class="emoji">✉️</span><span class="emoji">🏋️‍♀️</span><span class="emoji">🌿</span>
    <span class="note">Only these. Never decorative.</span>
  </div>
</div>
<script>lucide.createIcons();</script>
</body></html>
