<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Ocean</title>
<style>
html,body{margin:0;padding:0;background:#FBF8F1;font-family:ui-sans-serif,system-ui,sans-serif}
.wrap{padding:24px 28px;display:grid;grid-template-columns:repeat(10,1fr);gap:10px}
.swatch{aspect-ratio:1/1.1;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:#0B2A3E;font-size:10px;line-height:1.2;font-weight:600;font-family:ui-monospace,monospace}
.swatch .name{opacity:0.6;font-weight:500}
.swatch.dark{color:#FBF8F1}
.swatch.dark .name{color:#DDF1F4}
.label{grid-column:1/-1;font-family:'Bricolage Grotesque','Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:11px;letter-spacing:3px;color:#2A8FB7;text-transform:uppercase;margin-bottom:-4px}
</style></head>
<body>
<div class="wrap">
  <div class="label">Ocean · primary</div>
  <div class="swatch"      style="background:#F2F9FB"><span class="name">50</span><span>F2F9FB</span></div>
  <div class="swatch"      style="background:#DDF1F4"><span class="name">100</span><span>DDF1F4</span></div>
  <div class="swatch"      style="background:#B8DDE8"><span class="name">200</span><span>B8DDE8</span></div>
  <div class="swatch"      style="background:#87CEDA"><span class="name">300</span><span>87CEDA</span></div>
  <div class="swatch dark" style="background:#4FB3CC"><span class="name">400</span><span>4FB3CC</span></div>
  <div class="swatch dark" style="background:#2A8FB7"><span class="name">500</span><span>2A8FB7</span></div>
  <div class="swatch dark" style="background:#1F6E94"><span class="name">600</span><span>1F6E94</span></div>
  <div class="swatch dark" style="background:#154E70"><span class="name">700</span><span>154E70</span></div>
  <div class="swatch dark" style="background:#0E3954"><span class="name">800</span><span>0E3954</span></div>
  <div class="swatch dark" style="background:#0B2A3E"><span class="name">900</span><span>0B2A3E</span></div>
</div>
</body></html>
