<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Pills & Badges</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#FBF8F1;color:#0B2A3E;font-family:'Noto Sans JP',sans-serif}
.wrap{padding:22px 28px;display:flex;flex-direction:column;gap:14px}
.label{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:10px;letter-spacing:2.5px;color:#2A8FB7;text-transform:uppercase}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0.04em}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.full{background:#FBE9E5;color:#D64545;border:1px solid #FFC0AC}
.open{background:#E0F4ED;color:#1B7A5F;border:1px solid #9CD8C2}
.few{background:#FCF1D7;color:#8B6A0E;border:1px solid #F2B73D}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:500;background:#DDF1F4;color:#154E70;border:1px solid transparent}
.tag-strong{background:#0B2A3E;color:#FBF8F1}
.tag-out{background:transparent;border-color:#B8DDE8;color:#1F6E94}
.eyebrow{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:11px;letter-spacing:3px;color:#2A8FB7;text-transform:uppercase}
</style></head>
<body>
<div class="wrap">
  <div class="label">Status pills</div>
  <div class="row">
    <span class="pill full"><span class="dot" style="background:#D64545"></span>満員 / SOLD OUT</span>
    <span class="pill open"><span class="dot" style="background:#2EA88A"></span>受付中 / OPEN</span>
    <span class="pill few"><span class="dot" style="background:#F2B73D"></span>残りわずか / FEW LEFT</span>
  </div>
  <div class="label" style="margin-top:4px">Category tags</div>
  <div class="row">
    <span class="tag-strong tag">パーソナル</span>
    <span class="tag">アスリート育成</span>
    <span class="tag">オンライン</span>
    <span class="tag-out tag">7日リセット</span>
    <span class="eyebrow">METHOD · 01</span>
  </div>
</div>
</body></html>
