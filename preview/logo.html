<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Italianno&family=Zen+Kaku+Gothic+New:wght@500;700&family=Bricolage+Grotesque:wght@600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#FBF8F1;font-family:'Zen Kaku Gothic New',sans-serif;color:#0B2A3E}
.stage{padding:0;display:grid;grid-template-columns:1fr 1px 1.4fr;align-items:stretch;height:160px}
.cell{display:flex;align-items:center;justify-content:center;padding:18px 26px;position:relative}
.divider{background:linear-gradient(180deg,transparent, #DDF1F4 30%, #DDF1F4 70%, transparent)}

/* --- primary lockup ------------------------------------------------------ */
.primary{flex-direction:column;gap:6px;background:#FBF8F1}
.script{
  font-family:'Allura', cursive;
  font-weight:400;
  font-size:64px;
  line-height:0.85;
  color:#0B2A3E;
  letter-spacing:-0.5px;
  white-space:nowrap;
  /* slight optical adjustment so descender sits inside frame */
  margin-bottom:-6px;
}
.script .b{color:#0B2A3E}
.script .accent{color:#2A8FB7}
.under{display:flex;align-items:center;gap:10px;width:100%;justify-content:center;margin-top:2px}
.under .line{flex:1;height:1px;background:#B8DDE8;max-width:42px}
.under .jp{
  font-family:'Bricolage Grotesque',sans-serif;
  font-weight:600;
  font-size:9.5px;
  letter-spacing:5px;
  color:#6B6253;
  text-transform:uppercase;
}

/* --- mark (right, larger) ------------------------------------------------ */
.mark-cell{background:#0B2A3E;flex-direction:column;gap:10px}
.mark{
  width:96px;height:96px;border-radius:50%;
  background:#FBF8F1;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(11,42,62,0.08);
}
.mark .b{
  font-family:'Allura',cursive;
  font-weight:400;
  font-size:78px;
  line-height:0.8;
  color:#0B2A3E;
  position:relative;z-index:2;
  margin-top:6px;
  margin-left:-2px;
}
.mark svg{position:absolute;left:0;right:0;width:100%;color:#2A8FB7}
.mark .w1{bottom:24px;opacity:0.45}
.mark .w2{bottom:14px;opacity:0.85}

.mark-cap{
  font-family:'Bricolage Grotesque',sans-serif;
  font-weight:600;font-size:9px;letter-spacing:4px;
  color:#87CEDA;text-transform:uppercase;
}
</style></head>
<body>
<div class="stage">
  <div class="cell primary">
    <div class="script"><span class="b">Bay</span> <span>training</span> <span class="accent">gym</span></div>
    <div class="under">
      <span class="line"></span>
      <span class="jp">PERSONAL · MIYAZAKI</span>
      <span class="line"></span>
    </div>
  </div>
  <div class="divider"></div>
  <div class="cell mark-cell">
    <div class="mark">
      <span class="b">B</span>
      <svg class="w1" viewBox="0 0 96 14" fill="none" preserveAspectRatio="none"><path d="M0 7 Q 12 0, 24 7 T 48 7 T 72 7 T 96 7" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
      <svg class="w2" viewBox="0 0 96 14" fill="none" preserveAspectRatio="none"><path d="M0 7 Q 12 0, 24 7 T 48 7 T 72 7 T 96 7" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
    </div>
    <span class="mark-cap">B / MARK</span>
  </div>
</div>
</body></html>
