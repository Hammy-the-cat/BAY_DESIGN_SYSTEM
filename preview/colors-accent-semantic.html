<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Accents & Semantic</title>
<style>
html,body{margin:0;padding:0;background:#FBF8F1;font-family:ui-sans-serif,system-ui,sans-serif;color:#0B2A3E}
.wrap{padding:20px 28px;display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.group{display:flex;flex-direction:column;gap:8px}
.label{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#2A8FB7}
.row{display:flex;gap:8px}
.swatch{height:64px;flex:1;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:10px;font-family:ui-monospace,monospace;font-weight:600}
.swatch .n{font-family:'Zen Kaku Gothic New',sans-serif;font-size:11px;letter-spacing:1px}
.dark{color:#FBF8F1}.light{color:#0B2A3E}
</style></head>
<body>
<div class="wrap">
  <div class="group">
    <span class="label">Sunrise · accent (use once)</span>
    <div class="row">
      <div class="swatch light" style="background:#FFC0AC"><span class="n">300</span><span>FFC0AC</span></div>
      <div class="swatch dark" style="background:#FF7A5C"><span class="n">500 ◀ accent</span><span>FF7A5C</span></div>
      <div class="swatch dark" style="background:#E85D3F"><span class="n">600</span><span>E85D3F</span></div>
    </div>
  </div>
  <div class="group">
    <span class="label">Semantic</span>
    <div class="row">
      <div class="swatch dark" style="background:#2EA88A"><span class="n">success</span><span>2EA88A</span></div>
      <div class="swatch light" style="background:#F2B73D"><span class="n">warning</span><span>F2B73D</span></div>
      <div class="swatch dark" style="background:#D64545"><span class="n">danger</span><span>D64545</span></div>
      <div class="swatch dark" style="background:#2A8FB7"><span class="n">info</span><span>2A8FB7</span></div>
    </div>
  </div>
</div>
</body></html>
