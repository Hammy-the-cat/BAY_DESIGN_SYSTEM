<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Buttons</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#FBF8F1;color:#0B2A3E;font-family:'Noto Sans JP',sans-serif}
.wrap{padding:24px 28px;display:flex;flex-direction:column;gap:14px}
.label{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:10px;letter-spacing:2.5px;color:#2A8FB7;text-transform:uppercase}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
button{font-family:inherit;font-weight:700;border-radius:999px;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:8px;transition:all 280ms cubic-bezier(.22,.61,.36,1)}
.btn-lg{padding:14px 24px;font-size:15px}
.btn-md{padding:10px 18px;font-size:14px}
.btn-sm{padding:8px 14px;font-size:12px}
.primary{background:#FF7A5C;color:#fff;box-shadow:0 2px 6px rgba(11,42,62,0.06),0 12px 24px -8px rgba(232,93,63,0.25)}
.primary:hover{background:#E85D3F;transform:translateY(-1px);box-shadow:0 8px 24px rgba(232,93,63,0.25)}
.solid{background:#0B2A3E;color:#FBF8F1}
.solid:hover{background:#154E70;transform:translateY(-1px)}
.ghost{background:transparent;color:#0B2A3E;border:1.5px solid #B8DDE8}
.ghost:hover{background:#DDF1F4;border-color:#2A8FB7}
.link{background:transparent;color:#1F6E94;padding:6px 0;border-radius:0}
.link:hover{color:#0B2A3E}
.disabled{background:#E8DFC9;color:#8C7E5E;cursor:not-allowed;box-shadow:none}
.arrow{font-family:'Bricolage Grotesque',sans-serif}
</style></head>
<body>
<div class="wrap">
  <div class="label">Buttons</div>
  <div class="row">
    <button class="primary btn-lg">体験を予約する <span class="arrow">→</span></button>
    <button class="solid btn-md">コースを見る</button>
    <button class="ghost btn-md">詳しく</button>
    <button class="link">資料を読む →</button>
    <button class="primary btn-sm">DMで予約</button>
    <button class="disabled btn-md">満員</button>
  </div>
</div>
</body></html>
