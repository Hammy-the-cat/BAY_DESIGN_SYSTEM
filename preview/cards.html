<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=Bricolage+Grotesque:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#FBF8F1;color:#0B2A3E;font-family:'Noto Sans JP',sans-serif}
.wrap{padding:22px 28px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.card{background:#fff;border:1px solid #DDF1F4;border-radius:24px;padding:18px;box-shadow:0 1px 2px rgba(11,42,62,0.04),0 2px 8px rgba(11,42,62,0.04);display:flex;flex-direction:column;gap:8px;min-height:180px}
.eyebrow{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:10px;letter-spacing:2.5px;color:#2A8FB7;text-transform:uppercase}
.title{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:20px;line-height:1.2;letter-spacing:-0.5px}
.body{font-size:13px;line-height:1.7;color:#154E70;flex:1}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#6B6253}
.cta{color:#1F6E94;font-weight:700;font-family:'Bricolage Grotesque',sans-serif;letter-spacing:1px;font-size:11px;text-transform:uppercase}
.media{height:60px;border-radius:16px;background:linear-gradient(180deg,#87CEDA,#0E3954);margin:-4px -4px 6px -4px;position:relative;overflow:hidden}
.media svg{position:absolute;inset:auto 0 6px 0;width:100%;color:#FBF8F1;opacity:0.5}
</style></head>
<body>
<div class="wrap">
  <div class="card">
    <span class="eyebrow">METHOD · 01</span>
    <div class="title">姿勢を整える</div>
    <div class="body">理学療法士の評価から、骨格と動作のクセを読み解きます。</div>
    <div class="foot"><span>60min</span><span class="cta">詳しく →</span></div>
  </div>
  <div class="card">
    <div class="media"><svg viewBox="0 0 200 12" fill="none"><path d="M0 6 Q 20 0, 40 6 T 80 6 T 120 6 T 160 6 T 200 6" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></div>
    <span class="eyebrow">PROGRAM</span>
    <div class="title">7日 ボディリセット</div>
    <div class="body">短期で身体の感覚を取り戻す入門プログラム。</div>
  </div>
  <div class="card" style="background:#0B2A3E;border-color:#0B2A3E;color:#FBF8F1">
    <span class="eyebrow" style="color:#87CEDA">ONLINE</span>
    <div class="title" style="color:#FBF8F1">BAYトレ オンライン</div>
    <div class="body" style="color:#DDF1F4">場所を選ばず、海辺の方法を自宅へ。</div>
    <div class="foot"><span style="color:#87CEDA">¥4,900 / 月</span><span class="cta" style="color:#FF7A5C">JOIN →</span></div>
  </div>
</div>
</body></html>
