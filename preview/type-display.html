<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Type — Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=Noto+Sans+JP:wght@400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#FBF8F1;color:#0B2A3E;font-family:'Noto Sans JP',sans-serif}
.wrap{padding:22px 28px;display:flex;flex-direction:column;gap:12px}
.spec{display:grid;grid-template-columns:90px 1fr;align-items:baseline;gap:18px}
.meta{font-family:'Bricolage Grotesque',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#6B6253}
.d1{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:64px;line-height:1;letter-spacing:-2px}
.d2{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:40px;line-height:1.05;letter-spacing:-0.5px}
.d3{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:28px;line-height:1.1}
</style></head>
<body>
<div class="wrap">
  <div class="spec"><span class="meta">DISPLAY · 80</span><span class="d1">姿勢を整える</span></div>
  <div class="spec"><span class="meta">H1 · 56</span><span class="d2">理想の身体へ</span></div>
  <div class="spec"><span class="meta">H2 · 40</span><span class="d3">海と動きを学ぶ</span></div>
</div>
</body></html>
