<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Sand</title>
<style>
html,body{margin:0;padding:0;background:#FBF8F1;font-family:ui-sans-serif,system-ui,sans-serif}
.wrap{padding:24px 28px;display:grid;grid-template-columns:repeat(10,1fr);gap:10px}
.swatch{aspect-ratio:1/1.1;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:#0B2A3E;font-size:10px;line-height:1.2;font-weight:600;font-family:ui-monospace,monospace;border:1px solid rgba(11,42,62,0.04)}
.swatch .name{opacity:0.6;font-weight:500}
.swatch.dark{color:#FBF8F1}
.swatch.dark .name{color:#E8DFC9}
.label{grid-column:1/-1;font-family:'Bricolage Grotesque','Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:11px;letter-spacing:3px;color:#2A8FB7;text-transform:uppercase;margin-bottom:-4px}
</style></head>
<body>
<div class="wrap">
  <div class="label">Sand · neutral</div>
  <div class="swatch"      style="background:#FBF8F1"><span class="name">50</span><span>FBF8F1</span></div>
  <div class="swatch"      style="background:#F5EFE0"><span class="name">100</span><span>F5EFE0</span></div>
  <div class="swatch"      style="background:#E8DFC9"><span class="name">200</span><span>E8DFC9</span></div>
  <div class="swatch"      style="background:#D6CAAE"><span class="name">300</span><span>D6CAAE</span></div>
  <div class="swatch"      style="background:#B5A684"><span class="name">400</span><span>B5A684</span></div>
  <div class="swatch dark" style="background:#8C7E5E"><span class="name">500</span><span>8C7E5E</span></div>
  <div class="swatch dark" style="background:#6B6253"><span class="name">600</span><span>6B6253</span></div>
  <div class="swatch dark" style="background:#4A4438"><span class="name">700</span><span>4A4438</span></div>
  <div class="swatch dark" style="background:#2C261C"><span class="name">800</span><span>2C261C</span></div>
  <div class="swatch dark" style="background:#1A140C"><span class="name">900</span><span>1A140C</span></div>
</div>
</body></html>
